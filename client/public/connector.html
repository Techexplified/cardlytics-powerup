<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Cardlytics – Connector</title>
    <!--
      power-up.min.js MUST be the first script loaded.
      It synchronously defines window.TrelloPowerUp and runs
      TrelloPowerUp.initialize(), which sets up the iframe handshake
      that App.jsx's module-level trelloT = TrelloPowerUp.iframe()
      depends on. Do not defer or async this script.
    -->
    <script src="https://p.trellocdn.com/power-up.min.js"></script>
  </head>
  <body>
    <script>
      var BASE_URL = window.location.origin;
      var KEY = "0919ce148a7f8507be8f698a755ffeda";

      TrelloPowerUp.initialize(
        {
          // ── Board-level button ────────────────────────────────────────────
          "board-buttons": function (t) {
            return [
              {
                text: "Cardlytics",
                icon: {
                  dark: BASE_URL + "/logo.png",
                  light: BASE_URL + "/logo.png",
                },
                callback: function (t) {
                  return t.modal({
                    title: "Cardlytics",
                    url: BASE_URL + "/index.html?mode=board",
                    fullscreen: false,
                    height: 600,
                  });
                },
              },
            ];
          },

          // ── List-level action ─────────────────────────────────────────────
          "list-actions": function (t) {
            return [
              {
                text: "Cardlytics",
                callback: function (t) {
                  return t.list("id").then(function (list) {
                    return t.modal({
                      title: "Cardlytics",
                      url: BASE_URL + "/index.html?mode=list&listId=" + list.id,
                      fullscreen: false,
                      height: 600,
                    });
                  });
                },
              },
            ];
          },

          "card-badges": async function (t) {
            try {
              const val = await t.get("board", "shared", "refreshTrigger");

              // 👇 force re-render cycle
              if (!val) {
                return [];
              }

              return [];
            } catch (e) {
              return [];
            }
          },

          "card-buttons": function (t) {
            return [];
          },

// ── Card back section ─────────────────────────────────────────────
          // t.signUrl() signs the iframe URL so the child page's
          // TrelloPowerUp.iframe() call can complete the handshake.
          // Without signing, iframe() throws "Client must be initialized".
          "card-back-section": function (t) {
            return {
              title: "Cardlytics",
              icon: BASE_URL + "/logo.png",
              content: {
                type: "iframe",
                url: t.signUrl(BASE_URL + "/index.html?view=card"),
                height: 70,
              },
            };
          },

          // ── First-run onboarding ──────────────────────────────────────────
          "on-enable": function (t) {
            return t.modal({
              title: "Welcome to Cardlytics 👋",
              url: BASE_URL + "/index.html?mode=onboarding",
              fullscreen: false,
              height: 500,
            });
          },

          // ── Auth / token management ───────────────────────────────────────
          "remove-data": function (t) {
            return t.set("member", "private", "token", null).then(function () {
              localStorage.removeItem("cardlytics_trello_token");
            });
          },

          "authorization-status": function (t) {
            var token = localStorage.getItem("cardlytics_trello_token");
            return { authorized: !!token };
          },

          "show-authorization": function (t) {
            return t.modal({
              title: "Connect Cardlytics",
              url: BASE_URL + "/index.html?mode=auth",
              fullscreen: false,
              height: 500,
            });
          },
        },
        {
          appKey: KEY,
          appName: "Cardlytics",
        },
      );
    </script>
  </body>
</html>
