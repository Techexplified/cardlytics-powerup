<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Cardlytics – Connector</title>
    <script src="https://p.trellocdn.com/power-up.min.js"></script>
  </head>
  <body>
    <script>
      var BASE_URL = window.location.origin;
      var KEY = 'eea918ac665b2e6ffcd2c13fb34decb4';

      TrelloPowerUp.initialize({
        'board-buttons': function(t) {
          return [{
            text: 'Cardlytics',
            icon: {
              dark: BASE_URL + '/logo-light.png',
              light: BASE_URL + '/logo-dark.png'
            },
            callback: function(t) {
              return t.modal({
                title: 'Cardlytics',
                url: BASE_URL + '/index.html?mode=board',
                fullscreen: false,
                height: 600
              });
            }
          }];
        },
        'list-actions': function(t) {
          return [{
            text: 'Cardlytics',
            callback: function(t) {
              return t.list('id').then(function(list) {
                return t.modal({
                  title: 'Cardlytics',
                  url: BASE_URL + '/index.html?mode=list&listId=' + list.id,
                  fullscreen: false,
                  height: 600
                });
              });
            }
          }];
        },
        'card-back-section': function(t) {
          return {
            title: 'Cardlytics',
            icon: BASE_URL + '/logo.png',
            content: {
              type: 'iframe',
              url: t.signUrl(BASE_URL + '/index.html?view=card'),
              height: 44
            }
          };
        },
        'on-enable': function(t) {
          return t.modal({
            title: 'Welcome to Cardlytics 👋',
            url: BASE_URL + '/index.html?mode=onboarding',
            fullscreen: false,
            height: 500
          });
        },
        'show-settings': function(t) {
          return t.modal({
            title: 'Cardlytics Settings',
            url: BASE_URL + '/index.html?mode=settings',
            fullscreen: false,
            height: 400
          });
        },
        'authorization-status': function(t) {
          return t.get('member', 'private', 'token').then(function(token) {
            return { authorized: !!token };
          });
        },
        'show-authorization': function(t) {
          return t.popup({
            title: 'Connect Cardlytics',
            url: BASE_URL + '/index.html?mode=auth',
            height: 200
          });
        }
      }, {
        appKey: KEY,
        appName: 'Cardlytics'
      });
    </script>
  </body>
</html>
