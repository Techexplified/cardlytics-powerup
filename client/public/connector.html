<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Cardlytics – Connector</title>
    <script src="https://p.trellocdn.com/power-up.min.js"></script>
  </head>
  <body>
    <script>
      var BASE_URL = window.location.origin;
      var KEY = "eea918ac665b2e6ffcd2c13fb34decb4";

      TrelloPowerUp.initialize(
        {
          "board-buttons": function (t) {
            return [
              {
                text: "Cardlytics",
                icon: {
                  dark: BASE_URL + "/logo.png",
                  light: BASE_URL + "/logo.png",
                },
                callback: function (t) {
                  return t.modal({
                    title: "Cardlytics",
                    url: BASE_URL + "/index.html?mode=board",
                    fullscreen: false,
                    height: 600,
                  });
                },
              },
            ];
          },
          "list-actions": function (t) {
            return [
              {
                text: "Cardlytics",
                callback: function (t) {
                  return t.list("id").then(function (list) {
                    return t.modal({
                      title: "Cardlytics",
                      url: BASE_URL + "/index.html?mode=list&listId=" + list.id,
                      fullscreen: false,
                      height: 600,
                    });
                  });
                },
              },
            ];
          },
          "card-back-section": function (t) {
            return {
              title: "Cardlytics",
              icon: BASE_URL + "/logo.png",
              content: {
                type: "iframe",
                url: t.signUrl(BASE_URL + "/index.html?view=card"),
                height: 44,
              },
            };
          },
          "on-enable": function (t) {
            return t.modal({
              title: "Welcome to Cardlytics 👋",
              url: BASE_URL + "/index.html?mode=onboarding",
              fullscreen: false,
              height: 500,
            });
          },
          "remove-data": function (t) {
            return t.set("member", "private", "token", null).then(function () {
              localStorage.removeItem("cardlytics_trello_token");
            });
          },
          "authorization-status": function (t) {
            return t
              .get("member", "private", "cardlyticsConnected")
              .then(function (val) {
                return { authorized: !!val };
              });
          },

          "remove-personal-settings": function (t) {
            return t
              .remove("member", "private", "cardlyticsConnected")
              .then(function () {
                return t.remove("member", "private", "token");
              })
              .then(function () {
                return t.remove("board", "shared", "webhookRegistered");
              })
              .catch(function () {});
          },

          "show-authorization": function (t) {
            return t.modal({
              title: "Connect Cardlytics",
              url: BASE_URL + "/index.html?mode=auth",
              fullscreen: false,
              height: 500,
            });
          },
        },
        {
          appKey: KEY,
          appName: "Cardlytics",
        },
      );
    </script>
  </body>
</html>
